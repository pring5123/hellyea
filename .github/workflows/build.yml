name: Build Windows Backup Program

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HanmiBackup-Windows-x64
        path: build/bin/Release/HanmiBackup.exe
        if-no-files-found: error

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: build/bin/Release/HanmiBackup.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send email with build artifact
      if: success()
      continue-on-error: true
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        secure: true
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "한미 백업 프로그램 빌드 완료 - ${{ github.sha }}"
        to: 2024502@hanmisemi.com
        from: ${{ secrets.EMAIL_USERNAME }}
        body: |
          한미 폴더 백업 프로그램 빌드가 성공적으로 완료되었습니다.

          커밋: ${{ github.sha }}
          브랜치: ${{ github.ref }}
          빌드 시간: ${{ github.event.head_commit.timestamp }}

          첨부된 파일을 실행하시면 됩니다.

          GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        attachments: build/bin/Release/HanmiBackup.exe
